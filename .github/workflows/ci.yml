name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    # 15, not 5: with a warm setup-node cache the whole job finishes in ~2-3 min, but on
    # a cache miss `npm ci` alone takes ~5 min. That cancelled PR #80 on 2026-09-04, on
    # green code. The ceiling is a runaway guard, not a performance budget.
    timeout-minutes: 15

    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run linter
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm run test:run

      # One integration test, not the suite. The adapter hardcodes the SDK's
      # built-in agent roster in BUILTIN_AGENT_NAMES, because AgentInfo carries
      # no built-in/custom flag; when the SDK changes that roster the set drifts
      # silently, and a newly added built-in leaks into the ACP agent picker as
      # if the user had configured it. This test drives the real SDK and is the
      # only thing that notices.
      #
      # It had been failing unseen: the whole integration suite is gated behind
      # RUN_INTEGRATION_TESTS, which no job set, so `claude-code-guide` stayed
      # in the set long after the SDK dropped it and no pull request ever went
      # red. Running it here is what closes that hole.
      #
      # The rest of the suite deliberately stays out. Those tests open real
      # sessions — /compact, /rewind, a thinking toggle across a model switch —
      # and need Anthropic credentials the runner does not have and should not
      # be given for a pull request. Measured through act: this file passes in a
      # bare container in ~0.4s, while the session-driven files fail there for
      # want of auth. A green that needs a secret is not a green worth adding.
      - name: Check the SDK's built-in agent roster
        run: RUN_INTEGRATION_TESTS=true npx vitest run src/tests/agent-discovery.test.ts
