name: Publish and Release
on:
  push:
    branches:
      - main

# Default to no permissions; each job requests exactly what it needs.
permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release # Optional: for enhanced security
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      # A GitHub App token, not GITHUB_TOKEN: GitHub holds every workflow run on a
      # PR opened by github-actions[bot] in action_required until a maintainer
      # approves it, so release PRs merged with no CI at all. A PR authored by an
      # App with write access runs its checks without that approval.
      - name: Generate GitHub App token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          # Do not add release-type here. The action ignores config-file whenever
          # release-type is set, which silently disables the pre-1.0 versioning
          # rules in release-please-config.json and lets a breaking change jump
          # straight to 1.0.0. The node release type is declared in that config
          # instead, so nothing is lost by leaving this out.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

  bundle:
    name: Attach bundle to the GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [release-please]
    if: ${{ needs.release-please.outputs.release_created }}
    permissions:
      contents: write # gh release upload
    env:
      TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "lts/*"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      # Flat bundle (no top-level dir) consumed by the bentoo overlay ebuild:
      # dist/ + production node_modules + package.json + README/LICENSE.
      - name: Build and upload bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${TAG_NAME#v}"
          stage="$(mktemp -d)"
          cp package.json package-lock.json README.md LICENSE "$stage/"
          cp -r dist "$stage/dist"
          (cd "$stage" && npm ci --omit=dev --loglevel=error && rm package-lock.json)
          tar -czf "claude-agent-acp-plus-${version}-bundle.tar.gz" \
            -C "$stage" package.json README.md LICENSE dist node_modules
          gh release upload "$TAG_NAME" "claude-agent-acp-plus-${version}-bundle.tar.gz"

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [release-please]
    if: ${{ needs.release-please.outputs.release_created }}
    environment: release # Optional: for enhanced security
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # Setup .npmrc file to publish to npm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run build
      # Provenance attestation via OIDC (trusted publishing); runner's LTS npm
      # is recent enough — installing an unpinned npm@latest at publish time
      # would itself be a supply-chain exposure.
      - run: npm publish --provenance
