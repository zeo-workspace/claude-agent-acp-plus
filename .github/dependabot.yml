# Version updates stopped running when this repository moved from lucascouts to the
# zeo-workspace organization on 2026-10-01; the last scheduled job ran that day. A push
# touching this file re-registers the configuration, so this comment is that push.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # Check for updates to GitHub Actions every week
      interval: "weekly"
    # One PR per week for all actions, rather than one PR per action. Each PR
    # runs the full CI matrix, so ungrouped bumps that land the same day pay
    # for that matrix once apiece and review the same class of change twice.
    groups:
      actions:
        patterns:
          - "*"
    # Release cooldown: don't adopt a version published <7 days ago
    # (mitigates freshly-compromised releases).
    cooldown:
      default-days: 7

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    allow:
      - dependency-type: "all"
    groups:
      minor:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # TypeScript 7 is the native port and exposes no compiler API, so
      # typescript-eslint cannot support it (peer stays typescript <6.1.0).
      # Drop this once typescript-eslint/typescript-eslint#10940 closes.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # The Claude Agent SDK bundles the CLI, and the CLI has behaviour cliffs
      # this adapter's turn accounting reasons from. This block had TWO reasons
      # and now has one; the dead one is recorded here rather than deleted,
      # because a reader who finds only the survivor cannot tell whether the
      # other was resolved or forgotten.
      #
      # RESOLVED. CLI >=2.1.270 withholds `idle` while background agents run,
      # and this adapter did not carry upstream's sweep of `owedTrailingIdles`
      # at the `running` transition. It does now: 253b9c8, which lands the
      # sweep and the `[turn/idle-debt] at=running-transition` log beside it.
      # The pin crossed that cliff on 2026-09-22 and sits at 0.3.273, whose
      # bundled CLI is 2.1.273.
      #
      # CROSSED 2026-09-23, MEASURED, NOT PORTED. CLI >=2.1.274 answers queued
      # background completions with placeholder results. The pin moved
      # 0.3.273 -> 0.3.280 (CLI 2.1.280) to make Claude Opus 5.5 offerable, so
      # this cliff is now behind the pin. No port was written; what replaced it
      # is a live measurement of the exact shape the cliff describes, driven
      # through the built adapter over ACP stdio:
      #
      #   turn 1  spawns a background subagent running `sleep 45` and returns
      #           end_turn in 14.7 s -- so its completion is genuinely QUEUED,
      #           not delivered inside the turn
      #   turn 2  end_turn in 1.6 s, while the subagent is still sleeping
      #   (wait 75 s, so the completion has certainly been delivered)
      #   turn 3  end_turn in 1.5 s   turn 4  end_turn in 1.9 s
      #
      # No turn hung, before or after delivery. A first attempt at this looked
      # green and proved nothing -- its subagents finished inside the turn, so
      # no completion was ever queued. The wait is what makes it evidence.
      #
      # WHAT THIS IS NOT. It is one prompt shape, run twice, on one account. It
      # is not a regression test and nothing re-runs it. If a turn hangs around
      # background subagents, SUSPECT THIS FIRST and re-run the probe before
      # looking anywhere else. The honest state is "measured safe", not "ported".
      #
      # RAISED BY HAND AGAIN 2026-10-15: 0.3.285 -> 0.3.296 (CLI 2.1.296), for
      # Claude Haiku 5.5 and the request_marker_lists_v1 capability, inside the
      # 7-day cooldown by operator decision, with upstream #1271/#1330's
      # companions ported in the same change. The probe above was not re-run
      # for it.
      #
      # WHY THE IGNORE STAYS, with both reasons now behind the pin. It stops the
      # PROPOSAL; the guard stops the MERGE; and only the guard survives a bump
      # made by hand -- so they are not redundant. The unit suite cannot catch a
      # crossing either: the idle cadence comes from the doubles in
      # src/tests/session-doubles.ts, so a bumped pin stays green. Dependabot
      # PR #106 was merged on 2026-09-22 for exactly that reason and had to be
      # reverted (cddfd82). The 2026-09-23 bump was made by hand for a reason an
      # auto-PR cannot have -- a named model release -- and carried the live
      # measurement above. That is the bar: an SDK bump here is a deliberate
      # change with a probe attached, never a merge. The pin moves in a
      # fork-sync story, with the fork leading -- src/tests/deps.test.ts in the
      # fork enforces that order from its side.
      - dependency-name: "@anthropic-ai/claude-agent-sdk"
      - dependency-name: "@anthropic-ai/claude-agent-sdk-*"
    # Release cooldown: don't adopt a version published <7 days ago
    # (mitigates freshly-compromised releases).
    #
    # Scope: this holds back DIRECT dependencies only. Transitive versions the
    # resolver pulls into the lockfile are not gated by it. Observed on 2026-08-05:
    # the same run declined globals 17.9.0 (3 days old, direct) while adopting
    # express-rate-limit 8.6.2 (1 day old, transitive via @modelcontextprotocol/sdk).
    # Closing that gap needs a different tool (Renovate's minimumReleaseAge), not
    # a setting here — so don't read a green Dependabot run as "nothing fresh landed".
    cooldown:
      default-days: 7
